# Angel One intraday trading — configuration
#
# Copy to config.yaml and edit. NO CREDENTIALS GO IN THIS FILE: each account
# names an env_prefix, and the secrets are read from .env / the environment.
#
# Times must be quoted strings ("09:30"), otherwise YAML may read them as numbers.

# ---------------------------------------------------------------- accounts
# One entry per Angel One account. Every account trades the same signals,
# sized independently against its own capital.
accounts:
  - name: primary
    env_prefix: ANGEL_PRIMARY   # reads ANGEL_PRIMARY_API_KEY, _CLIENT_CODE, _MPIN, _TOTP_SECRET
    enabled: true
    capital: 100000             # capital this account allocates to intraday
    risk_multiplier: 1.0        # scales this account's risk per trade
    is_data_source: true        # exactly one account supplies market data

  # - name: secondary
  #   env_prefix: ANGEL_SECONDARY
  #   enabled: true
  #   capital: 50000
  #   risk_multiplier: 1.0

# ----------------------------------------------------------------- universe
# Used when the screener is disabled, and as the fallback if screening fails.
# Keep it short and liquid — more symbols means more marginal trades, not
# better ones.
exchange: NSE
symbols:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - SBIN

# Never trade these, whatever the screener picks. Useful if you already hold
# shares in delivery in the same account and would rather the engine stayed
# away from those names entirely. (It never sells holdings regardless — every
# order is INTRADAY — this just keeps the two from overlapping at all.)
exclude_symbols: []
  # - RELIANCE
  # - TATAMOTORS

# ---------------------------------------------------------------- screener
# Picks the day's shares automatically each morning instead of trading a fixed
# list. It screens `universe` on daily candles and keeps the best few.
#
# It selects for tradeable mechanics — liquidity, volatility, trend quality —
# not for opinions about which company will do well. Nothing here reads news
# or fundamentals.
#
# Cost: one API call per universe symbol at start-up, so ~60 names takes about
# a minute. Names that no longer exist are skipped harmlessly.
screener:
  enabled: true
  shortlist_size: 6             # how many to trade today
  lookback_days: 20

  # Hard filters — a name must clear all of them to be ranked at all.
  min_turnover_crore: 50.0      # average daily traded value; the key liquidity gate
  min_price: 100.0              # skip penny stocks
  max_price: 5000.0             # cap so one share fits the per-position budget
  min_atr_pct: 1.0              # must move enough to pay for a round trip
  max_atr_pct: 6.0              # skip news-driven chaos
  min_adx: 15.0                 # must actually trend rather than oscillate
  require_affordable: true      # drop names one share of which exceeds the budget

  # Ranking weights (normalised internally).
  weight_liquidity: 0.4
  weight_volatility: 0.3
  weight_trend: 0.3

  # Edit freely. Index membership changes over time; unresolvable names are
  # skipped with a log line rather than causing an error.
  universe:
    - RELIANCE
    - HDFCBANK
    - ICICIBANK
